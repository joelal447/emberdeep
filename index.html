<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120d1f">
<title>Emberdeep: The Riddle Vaults</title>
<style>
:root{--ink:#f3e9d2;--dim:#b9a98c;--bg:#120d1f;--card:#1d1630;--card2:#271d40;--gold:#e9b955;--ember:#ff8a3c;--line:#4a3a6b;--good:#6fe0a0;--bad:#ff6b7a;--sj:#e9b955;font-family:ui-rounded,"Arial Rounded MT Bold","Avenir Next","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.hidden{display:none!important}
/* HUD */
.hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:flex-start}
.hud.tl{top:calc(10px + env(safe-area-inset-top));left:10px}
.hud.tr{top:calc(10px + env(safe-area-inset-top));right:10px;align-items:center}
.plate{background:linear-gradient(#2a2046ee,#1a1330ee);border:2px solid var(--gold);border-radius:14px;padding:7px 12px;box-shadow:0 6px 18px #0009,inset 0 1px 0 #ffffff22}
.plate small{display:block;color:var(--gold);letter-spacing:2px;font-size:10px;font-weight:700}
.plate strong{font-size:16px}
.sigils{display:flex;gap:5px;margin-top:4px}
.sigils i{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);border:2px solid #6d5a94;background:#2b2146;transition:.3s}
.sigils i.on{background:var(--gold);border-color:#fff3c4;box-shadow:0 0 8px var(--gold)}
.pill{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.pill.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.2)}}
.lvl{display:flex;align-items:center;gap:8px;min-width:120px}
.lvl b{width:30px;height:30px;border-radius:50%;background:radial-gradient(#ffd98a,#d08a2a);color:#3a2206;display:grid;place-items:center;font-size:14px;box-shadow:0 0 0 2px #fff3c4}
.lvl .bar{flex:1;height:8px;border-radius:5px;background:#3a2d5c;overflow:hidden;min-width:60px}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a3c,#ffd257);width:0;transition:width .5s}
.lvl span{font-size:10px;color:var(--dim);display:block;line-height:1.1}
.rbtn{width:40px;height:40px;border-radius:50%;background:linear-gradient(#2a2046ee,#1a1330ee);border:2px solid var(--gold);font-size:17px}
.bar5{position:fixed;z-index:5;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:18px;background:#120d1fd9;border:2px solid var(--line)}
.bar5 button{background:linear-gradient(#34295a,#231a3d);border:2px solid #57457f;border-radius:12px;padding:8px 13px;font-weight:700;font-size:14px;white-space:nowrap;position:relative}
.bar5 button:hover{border-color:var(--gold)}
.bar5 em{position:absolute;top:-7px;right:-5px;background:var(--ember);color:#fff;border-radius:10px;font-style:normal;font-size:10px;padding:1px 6px}
#prompt{position:fixed;z-index:5;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#120d1fe6;border:2px solid var(--gold);border-radius:16px;padding:9px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 0 0 6px #e9b95522,0 10px 24px #000a;max-width:92vw}
#prompt span{font-size:26px}#prompt b{display:block}#prompt small{color:var(--dim)}
#toasts{position:fixed;z-index:70;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:grid;gap:8px;pointer-events:none;width:min(92vw,460px)}
.toast{background:linear-gradient(135deg,#3a2a66,#231a3d);border:2px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:700;text-align:center;animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .4s 3s forwards;box-shadow:0 10px 24px #000a}
.toast.ach{border-color:#ffd257;background:linear-gradient(135deg,#6a4a12,#3a2a0a)}
.toast small{display:block;color:var(--dim);font-weight:400}
body.mo #toasts{top:auto;bottom:calc(10px + env(safe-area-inset-bottom))}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
/* modals */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:14px;background:radial-gradient(#120d1f99,#07050dee);backdrop-filter:blur(3px);overflow:auto}
.card{width:min(680px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:linear-gradient(var(--card2),var(--card));border:3px solid var(--gold);border-radius:22px;padding:22px 24px;box-shadow:0 0 0 6px #e9b95520,0 30px 60px #000c;position:relative;animation:cin .35s cubic-bezier(.2,1.3,.4,1);touch-action:pan-y}
.card.wide{width:min(900px,100%)}
@keyframes cin{from{opacity:0;transform:translateY(20px) scale(.95)}}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:#3a2d5c;border:2px solid #6d5a94;font-size:16px;z-index:2}
h1,h2,h3{margin:0;font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.eyebrow{color:var(--gold);letter-spacing:3px;font-size:11px;font-weight:700;margin:0 0 4px}
.btn{background:linear-gradient(#ffb04a,#e0701f);color:#2a1202;border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #9a4a10,0 10px 20px #0006}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a4a10}
.btn.ghost{background:#34295a;color:var(--ink);box-shadow:0 5px 0 #1b1432;border:2px solid #57457f}
.btn:disabled{filter:grayscale(1);opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
/* welcome */
#welcome .card{text-align:center;overflow:hidden}
.title{font-size:clamp(44px,9vw,78px);line-height:.95;letter-spacing:2px;background:linear-gradient(#fff1c4,#ffb04a 55%,#d2541a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 14px #ff8a3c66)}
.sub{letter-spacing:8px;color:var(--gold);font-size:13px;margin:6px 0 14px}
.flame{font-size:58px;animation:flick 1.6s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 0 22px #ff8a3c)}
@keyframes flick{50%{transform:scale(1.08) rotate(-3deg)}}
#nameIn{display:block;margin:14px auto;width:min(100%,300px);padding:12px 14px;border-radius:12px;border:2px solid #57457f;background:#120d1f;color:var(--ink);font:inherit;font-size:18px;text-align:center;user-select:text;-webkit-user-select:text}
.lede{color:var(--dim);max-width:480px;margin:0 auto;line-height:1.5}
/* talk */
.talk{display:flex;gap:16px;align-items:center}
.portrait{flex:0 0 auto;width:112px;height:112px;border-radius:24px;background:radial-gradient(#4a3a7a,#1a1330);border:3px solid var(--gold);display:grid;place-items:center;font-size:66px;box-shadow:0 0 24px var(--glow,#e9b95566)}
.talk p{line-height:1.5;margin:6px 0 0;font-size:17px}
/* quiz */
#quiz .card{border-color:var(--sj);box-shadow:0 0 0 6px color-mix(in srgb,var(--sj) 18%,transparent),0 30px 60px #000c}
.qtop{display:flex;align-items:center;gap:10px;margin-right:40px}
.chip{background:var(--sj);color:#1a1202;font-weight:800;border-radius:10px;padding:4px 10px;font-size:12px;letter-spacing:1px}
.pips{display:flex;gap:5px;margin-left:auto}
.pips i{width:11px;height:11px;border-radius:50%;background:#3a2d5c}.pips i.d{background:var(--good)}.pips i.n{background:var(--sj);box-shadow:0 0 0 3px #ffffff22}.pips i.m{background:var(--bad)}
.combo{font-weight:800;color:#ffb04a}
.timer{height:5px;border-radius:3px;background:#3a2d5c;margin:10px 0 0;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd257,#ff8a3c);transform-origin:left}
.foe{display:flex;align-items:center;gap:12px;background:#120d1f;border:2px solid #57457f;border-radius:16px;padding:8px 12px;margin-top:12px}
.foe .face{font-size:46px;transition:transform .2s}.foe.hit .face{animation:hit .4s}.foe .grow{flex:1}
@keyframes hit{20%{transform:translateX(-8px) rotate(-8deg);filter:brightness(3)}60%{transform:translateX(6px)}}
.hp{display:flex;gap:4px;margin-top:4px}.hp i{flex:1;height:10px;border-radius:4px;background:#e0443f;max-width:34px;transition:.3s}.hp i.off{background:#3a2d5c}
.hearts{font-size:20px;letter-spacing:2px}
.qprompt{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(20px,3.4vw,28px);line-height:1.3;margin:16px 0 6px;text-align:center;white-space:pre-line;font-weight:700}
#qvis:empty{display:none}#qvis{display:flex;justify-content:center;margin:8px 0}
.abc{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;max-width:420px;width:100%}
.abc i{font-style:normal;background:#120d1f;border:1px solid #57457f;border-radius:5px;text-align:center;font-size:13px;padding:2px 0;color:var(--gold);font-weight:700}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px auto 0;max-width:560px}
.opt{background:#120d1f;border:2px solid #57457f;border-radius:14px;padding:13px 12px;font-weight:700;font-size:17px;min-height:56px;text-align:center;transition:.12s;animation:oin .3s backwards}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes oin{from{opacity:0;transform:translateY(8px)}}
.opt:hover:not(:disabled){border-color:var(--sj);transform:translateY(-2px)}
.opt.ok{background:#17402c;border-color:var(--good);color:#d6ffe6;animation:pop .4s}
.opt.no{background:#401722;border-color:var(--bad);opacity:.55;animation:shake .3s}
.opt.out{opacity:.3}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.typed{display:grid;gap:10px;justify-items:center;margin-top:12px}
.disp{min-width:200px;min-height:56px;padding:8px 18px;border-radius:14px;background:#120d1f;border:2px solid var(--sj);font-size:30px;font-weight:800;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums}
.disp.no{animation:shake .3s;border-color:var(--bad)}.disp.ok{border-color:var(--good);background:#17402c}
.disp small{font-size:16px;color:var(--dim);margin-left:6px;letter-spacing:0}
input.disp{color:var(--ink);font:inherit;font-size:26px;font-weight:800;text-transform:uppercase;width:min(100%,340px);user-select:text;-webkit-user-select:text;outline:0}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,420px)}
.pad button{background:#34295a;border:2px solid #57457f;border-radius:10px;padding:9px 0;font-weight:800;font-size:18px}
.pad button.go{grid-column:span 2;background:linear-gradient(#ffb04a,#e0701f);color:#2a1202;border:0}
.clues{display:grid;gap:6px;margin:10px auto;max-width:520px}
.clue{display:flex;align-items:center;gap:10px;background:#120d1f;border:1px solid #57457f;border-radius:12px;padding:6px 10px;text-align:left;font-size:14px}
.clue b{display:flex;gap:4px}.clue b i{font-style:normal;width:30px;height:34px;border-radius:7px;background:linear-gradient(#f3e9d2,#cdbb93);color:#2a1a06;display:grid;place-items:center;font-size:19px;font-weight:800}
.dials{display:flex;gap:10px;justify-content:center}
.dial{display:grid;gap:4px;justify-items:center}
.dial button{width:54px;height:30px;border-radius:9px;background:#34295a;border:2px solid #57457f;font-size:13px}
.dial b{width:54px;height:60px;border-radius:12px;background:linear-gradient(#f3e9d2,#cdbb93);color:#2a1a06;display:grid;place-items:center;font-size:34px;box-shadow:inset 0 -5px 0 #0002}
.dial.cur b{box-shadow:0 0 0 3px var(--sj),inset 0 -5px 0 #0002}
.qfoot{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
.hintb{background:transparent;border:2px dashed #6d5a94;border-radius:12px;padding:8px 14px;color:var(--dim);font-weight:700}
.fb{text-align:center;margin-top:12px;min-height:24px;line-height:1.4}
.fb.ok{color:#bfffd8}.fb.no{color:#ffc2c8}.fb.hint{color:#ffe2a8}
.fb b{font-size:18px}
/* loot */
#loot .card{text-align:center;overflow:hidden}
.rays{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--rc,#e9b955) 6%,transparent 12%,transparent 25%,var(--rc,#e9b955) 31%,transparent 37%,transparent 50%,var(--rc,#e9b955) 56%,transparent 62%,transparent 75%,var(--rc,#e9b955) 81%,transparent 87%);opacity:.14;animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.relic{position:relative;width:150px;height:150px;margin:8px auto;border-radius:30px;display:grid;place-items:center;font-size:84px;background:radial-gradient(#3a2d5c,#120d1f);border:4px solid var(--rc,#e9b955);box-shadow:0 0 40px var(--rc,#e9b955);animation:flip .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes flip{from{transform:rotateY(180deg) scale(.3);opacity:0}}
.rar{font-weight:800;letter-spacing:3px;font-size:12px;color:var(--rc)}
.fact{background:#120d1f;border-left:4px solid var(--rc,var(--gold));border-radius:10px;padding:10px 14px;margin:12px auto;max-width:480px;text-align:left;line-height:1.45;color:#eadfc6}
.gains{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.gains span{background:#120d1f;border:2px solid #57457f;border-radius:12px;padding:6px 12px;font-weight:800}
/* panels */
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tabs button{background:#120d1f;border:2px solid #57457f;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}.tabs button.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cell{background:#120d1f;border:2px solid var(--rc,#57457f);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;font-weight:700;min-height:104px}
.cell span{display:block;font-size:38px;line-height:1.2}.cell.lock{opacity:.45;border-style:dashed}.cell.lock span{filter:grayscale(1) brightness(.3)}
.cell small{display:block;color:var(--rc);font-size:9px;letter-spacing:1px}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:#120d1f;border:2px solid #57457f;border-radius:14px;padding:10px 12px}
.item .ic{font-size:30px;width:40px;text-align:center}.item .grow{flex:1}.item small{color:var(--dim);display:block}
.item.done{border-color:var(--gold)}.item.locked{opacity:.5}
.meter{height:9px;border-radius:5px;background:#3a2d5c;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sj),#fff3c4)}
.mapwrap{display:grid;place-items:center}#bigmap{width:min(100%,460px);aspect-ratio:1;border-radius:14px;border:2px solid #57457f;background:#07050d}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.help div{background:#120d1f;border-radius:12px;padding:10px;text-align:center}.help b{display:block;color:var(--gold)}
/* touch */
#joy,#tjump,#tact{display:none}
@media (pointer:coarse),(max-width:720px){
 #joy{display:block;position:fixed;z-index:6;left:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:radial-gradient(#ffffff26,#00000055);border:3px solid #e9b955aa;touch-action:none}
 #joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(#ffe2a8,#d08a2a);box-shadow:0 4px 10px #0008;pointer-events:none}
 #tjump,#tact{display:block;position:fixed;z-index:6;border-radius:50%;border:3px solid #fff3c4;font-weight:800;color:#2a1202}
 #tact{right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:80px;height:80px;background:radial-gradient(#ffd98a,#e0701f);font-size:13px}
 #tjump{right:108px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;background:radial-gradient(#bfe8ff,#4a8fd0);font-size:11px}
 .bar5{gap:3px;padding:4px;width:calc(100% - 12px);justify-content:space-between}.bar5 button{padding:8px 4px;font-size:11px;flex:1}.bar5 button b{display:none}
 .plate strong{font-size:13px}.lvl{min-width:96px}#prompt{bottom:calc(176px + env(safe-area-inset-bottom))}
 .card{padding:16px 14px}.portrait{width:80px;height:80px;font-size:46px}.opt{font-size:15px;padding:10px 8px}.pad button{padding:11px 0}
 .hide-s{display:none}
}
@media (max-height:560px){.relic{width:90px;height:90px;font-size:50px}.flame{font-size:34px}.qprompt{margin:8px 0 2px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Emberdeep dungeon view. Move with W A S D or the arrow keys, press E to interact."></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="hud tl" id="hudL">
  <div class="plate"><small id="hDepth">FLOOR 1</small><strong id="hFloor" class="serif">Mosslight Crypt</strong><div class="sigils" id="hSig" role="img"></div></div>
</div>
<div class="hud tr" id="hudR">
  <div class="plate pill" id="hGems">💎 <span>0</span></div>
  <div class="plate lvl"><b id="hLv">1</b><div style="flex:1"><span id="hRank">Torch Bearer</span><div class="bar"><i id="hXp"></i></div></div></div>
  <button class="rbtn" id="soundBtn" aria-label="Sound">🔊</button>
  <button class="rbtn hide-s" id="helpBtn" aria-label="Help">?</button>
</div>
<div id="prompt" class="hidden"><span id="pIcon">🧙</span><div><b id="pName"></b><small id="pHow"></small></div></div>
<nav class="bar5" id="bar5">
  <button data-p="relics">🎒 <b>Relics</b><em id="nRel" class="hidden">0</em></button>
  <button data-p="trophies">🏆 <b>Trophies</b></button>
  <button data-p="map">🗺️ <b>Map</b></button>
  <button data-p="shop">🛒 <b>Shop</b></button>
  <button data-p="codex">📜 <b>Codex</b></button>
</nav>
<div id="joy"><i id="joyK"></i></div>
<button id="tjump">JUMP</button>
<button id="tact">USE</button>
<div id="toasts" aria-live="polite"></div>

<section class="modal" id="welcome"><div class="card">
  <div class="flame">🔥</div>
  <h1 class="title">EMBERDEEP</h1>
  <p class="sub">THE RIDDLE VAULTS</p>
  <p class="lede">Five floors of twisting dungeon lie below. Out-think the guardians, crack the locks, collect legendary relics, and face the dragon at the bottom.</p>
  <input id="nameIn" maxlength="16" placeholder="Adventurer name" autocomplete="off">
  <button class="btn" id="beginBtn">Light the torch 🔥</button>
  <p class="lede" style="font-size:12px;margin-top:14px">Progress saves on this device only.</p>
</div></section>

<section class="modal hidden" id="talk"><div class="card">
  <button class="x" data-close aria-label="Close">✕</button>
  <div class="talk"><div class="portrait" id="tFace"></div><div><p class="eyebrow" id="tKind"></p><h2 id="tName"></h2><p id="tText"></p></div></div>
  <div class="row" style="margin-top:18px"><button class="btn ghost" data-close id="tLater">Not yet</button><button class="btn" id="tGo">Begin</button></div>
</div></section>

<section class="modal hidden" id="quiz"><div class="card">
  <button class="x" id="qClose" aria-label="Leave">✕</button>
  <div class="qtop"><span class="chip" id="qChip"></span><span class="combo" id="qCombo"></span><div class="pips" id="qPips"></div></div>
  <div class="timer"><i id="qTimer"></i></div>
  <div class="foe hidden" id="qFoe"><div class="face" id="fFace"></div><div class="grow"><b id="fName"></b><div class="hp" id="fHp"></div></div><div class="hearts" id="fHearts"></div></div>
  <div class="qprompt" id="qPrompt"></div>
  <div id="qvis"></div>
  <div id="qAns"></div>
  <div class="fb" id="qFb" aria-live="polite"></div>
  <div class="qfoot"><button class="hintb" id="qHint">💡 Hint</button><button class="btn hidden" id="qNext">Next →</button></div>
</div></section>

<section class="modal hidden" id="loot"><div class="card">
  <div class="rays"></div>
  <p class="eyebrow" id="lEye"></p><h2 id="lTitle"></h2>
  <div id="lBody"></div>
  <button class="btn" id="lOk" style="margin-top:10px">Onward!</button>
</div></section>

<section class="modal hidden" id="panel"><div class="card wide">

const recent=[];
function makeQ(sub,L){L=clamp(Math.round(L),1,6);
 for(let t=0;t<12;t++){let q;
  if(sub==='maths'){const pool=MATHS.filter(g=>L>=g[0]&&L<=g[1]);q=pick(pool.length?pool:MATHS)[2]()}
  else if(sub==='logic'){if(Math.random()<.38){q=bankQ(LOGICBANK,Math.min(L,5),r=>/^\d+$/.test(r[2])&&r[0]>=4?num(r[1],r[2],'Read it slowly. The obvious answer is a trap.',r[4]):mc(r[1],r[2],r[3],r[4]))}else{const pool=LOGIC.filter(g=>L>=g[0]&&L<=g[1]);q=pick(pool.length?pool:LOGIC)[2]()}}
  else if(sub==='science'){q=bankQ(SCIENCE,L,r=>mc(r[1],r[2],r[3],r[4]))}
  else{const pool=WORDS.filter(g=>L>=g[0]&&L<=g[1]);q=pick(pool)[2](L)}
  q.sub=sub;q.lv=L;const key=q.prompt+'|'+q.answer;if(!recent.includes(key)||t===11){recent.push(key);recent.length>60&&recent.shift();return q}}
}

 else{const gems=5+S.depth;let got=null;if(Math.random()<.15)got=rollRelic();gainGems(gems+(got&&got.dupe?RARITY[got.rel.rar].g:0));save();checkAch();showLoot({eye:'PRACTICE COMPLETE',title:`${solved} of 4 solved`,rel:got&&got.rel,dupe:got&&got.dupe,gains:[`+${gems} 💎`,`+${Q.xp} XP`],plain:!got})}hud()}
function showLoot(o){const rc=o.rc||(o.rel?RARITY[o.rel.rar].c:'#e9b955');$('#loot .card').style.setProperty('--rc',rc);$('#lEye').textContent=o.eye;$('#lTitle').textContent=o.title;
 $('#lBody').innerHTML=o.html||((o.rel?`<div class="relic">${o.rel.e}</div><div class="rar">${RARITY[o.rel.rar].n.toUpperCase()} RELIC${o.dupe?' · DUPLICATE':''}</div><h3 style="margin-top:4px">${esc(o.rel.name)}</h3><div class="fact">${esc(o.rel.fact)}</div>${o.dupe?`<p class="lede" style="font-size:13px">You already had this one, so it turns into +${RARITY[o.rel.rar].g} gems.</p>`:''}`:'<div class="relic">💎</div>')+`<div class="gains">${(o.gains||[]).map(g=>`<span>${g}</span>`).join('')}</div>${o.note?`<p class="lede"><b>${esc(o.note)}</b></p>`:''}`);
 openM('loot');hud();if(o.rel){const r=o.rel.rar;chime(r==='legendary'?[523,659,784,1047,1319,1568,2093]:r==='epic'?[523,659,784,1047,1319]:[659,784,1047],'triangle');burst(innerWidth/2,innerHeight*.4,r==='legendary'?160:r==='epic'?100:o.big?90:50,[rc,'#fff','#ffd257'])}else if(!o.html){chime([784,1047]);burst(innerWidth/2,innerHeight*.4,30)}setTimeout(()=>$('#lOk').focus(),80)}

/* ---------------- panels ---------------- */
let relSel=null;
function panel(p,arg){const B=$('#pBody');openM('panel');
 if(p==='relics'){const own=Object.keys(S.relics).length;$('#pEye').textContent='RELIC VAULT';$('#pTitle').textContent=`${own} of ${RELICS.length} relics found`;const sel=RELICS.find(r=>r.id===relSel&&S.relics[r.id]);
  B.innerHTML=(sel?`<div class="fact" style="--rc:${RARITY[sel.rar].c};max-width:none"><b>${sel.e} ${esc(sel.name)}</b> · <span style="color:${RARITY[sel.rar].c}">${RARITY[sel.rar].n}</span>${S.relics[sel.id]>1?` · ×${S.relics[sel.id]}`:''}<br>${esc(sel.fact)}</div>`:`<p class="lede" style="margin:8px 0 12px;max-width:none">Win relics from guardians, chests and bosses. Tap one to read its secret.</p>`)+`<div class="grid">${RELICS.map(r=>S.relics[r.id]?`<button class="cell" data-r="${r.id}" style="--rc:${RARITY[r.rar].c}"><span>${r.e}</span>${esc(r.name)}<small>${RARITY[r.rar].n.toUpperCase()}</small></button>`:`<div class="cell lock" style="--rc:${RARITY[r.rar].c}"><span>${r.e}</span>???<small>${RARITY[r.rar].n.toUpperCase()}</small></div>`).join('')}</div>`;B.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{relSel=b.dataset.r;panel('relics');$('#panel .card').scrollTop=0}))}
 else if(p==='trophies'){$('#pEye').textContent='TROPHY HALL';$('#pTitle').textContent=`${S.ach.length} of ${ACH.length} trophies`;B.innerHTML=`<div class="list" style="margin-top:12px">${ACH.slice().sort((a,b)=>S.ach.includes(b.id)-S.ach.includes(a.id)).map(a=>{const d=S.ach.includes(a.id);return`<div class="item ${d?'done':'locked'}"><span class="ic">${d?a.e:'🔒'}</span><div class="grow"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div>${d?'<b>✓</b>':''}</div>`}).join('')}</div>`}
 else if(p==='map'){$('#pEye').textContent=`FLOOR ${S.depth+1}`;$('#pTitle').textContent=FL().name;B.innerHTML=`<p class="lede" style="margin:8px 0;max-width:none">The map fills in as you explore (${S.st.explored>=90?'90%+':Math.min(S.st.explored,100)+'%'} best). <span style="color:#ff6b9a">●</span> guardian · <span style="color:#6fe0a0">●</span> sigil won · <span style="color:#ffb04a">●</span> chest · <span style="color:#c9a8ff">●</span> rune stone · <span style="color:#ff4a3a">●</span> boss</p><div class="mapwrap"><canvas id="bigmap" width="630" height="630"></canvas></div>`;const G=$('#bigmap').getContext('2d');mapDraw(G,30);G.fillStyle='#ffb04a';G.save();G.translate(P.x*30,P.y*30);G.rotate(P.a+Math.PI/2);G.beginPath();G.moveTo(0,-13);G.lineTo(9,10);G.lineTo(0,5);G.lineTo(-9,10);G.fill();G.restore()}
 else if(p==='shop'){$('#pEye').textContent='THE GOBLIN MARKET';$('#pTitle').textContent=`You have ${fmt(S.gems)} 💎`;B.innerHTML=`<div class="list" style="margin-top:12px">${SHOP.map(it=>{const own=S.shop.own.includes(it.id),isL=/^lamp/.test(it.id),isP=/^pet/.test(it.id),active=isL?S.shop.lamp===it.id:isP?S.shop.pet===it.id:false;let btn;if(it.id==='shield')btn=`<button class="btn ghost" data-buy="shield" ${S.gems<it.cost||S.shop.shields>=3?'disabled':''}>${S.shop.shields>=3?'Full (3)':`Buy · ${it.cost} 💎`}</button>`;else if(!own)btn=`<button class="btn ghost" data-buy="${it.id}" ${S.gems<it.cost?'disabled':''}>Buy · ${it.cost} 💎</button>`;else btn=`<button class="btn ghost" data-use="${it.id}">${active?(isP?'Send home':'Lit ✓'):(isP?'Bring along':'Light it')}</button>`;return`<div class="item ${active?'done':''}"><span class="ic">${it.e}</span><div class="grow"><b>${esc(it.name)}${it.id==='shield'?` (you have ${S.shop.shields})`:''}</b><small>${esc(it.desc)}</small></div>${btn}</div>`}).join('')}</div>`;
  B.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>{const it=SHOP.find(i=>i.id===b.dataset.buy);if(S.gems<it.cost)return;S.gems-=it.cost;if(it.id==='shield')S.shop.shields=Math.min(3,S.shop.shields+1);else{S.shop.own.push(it.id);/^lamp/.test(it.id)?S.shop.lamp=it.id:(S.shop.pet=it.id,pet.x=P.x,pet.y=P.y)}chime([523,784,1047]);burst(innerWidth/2,innerHeight/2,40);save();hud();checkAch();panel('shop')}));
  B.querySelectorAll('[data-use]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.use;if(/^lamp/.test(id))S.shop.lamp=id;else{S.shop.pet=S.shop.pet===id?'':id;pet.x=P.x;pet.y=P.y}save();panel('shop')}))}
 else{const tab=arg||'lore';$('#pEye').textContent='CODEX';$('#pTitle').textContent=tab==='lore'?`${S.codex.length} of ${CODEX.length} rune stones read`:tab==='stats'?`${S.name}’s progress`:'How to play';
  let h=`<div class="tabs"><button data-t="lore" class="${tab==='lore'?'on':''}">📜 Lore</button><button data-t="stats" class="${tab==='stats'?'on':''}">📊 Progress</button><button data-t="help" class="${tab==='help'?'on':''}">❓ How to play</button></div>`;
  if(tab==='lore')h+=`<div class="list">${CODEX.map(c=>S.codex.includes(c.id)?`<div class="item done"><span class="ic">📜</span><div class="grow"><b>${esc(c.t)}</b><small style="color:#eadfc6">${esc(c.f)}</small></div></div>`:`<div class="item locked"><span class="ic">🔒</span><div class="grow"><b>???</b><small>A rune stone on floor ${c.fl+1}: ${FLOORS[c.fl].name}</small></div></div>`).join('')}</div>`;
  else if(tab==='stats'){const L=levelOf(S.xp);h+=`<div class="list">${Object.keys(SUBJECTS).map(k=>{const sj=SUBJECTS[k],sk=S.skills[k],acc=sk.total?Math.round(sk.right/sk.total*100):0;return`<div class="item" style="--sj:${sj.col}"><span class="ic">${sj.icon}</span><div class="grow"><b>${sj.name} · level ${sk.lv} of 6</b><small>${sk.total?`${sk.right} of ${sk.total} right first try (${acc}%)`:'Not tried yet'}</small><div class="meter"><i style="width:${sk.lv/6*100}%"></i></div></div></div>`}).join('')}</div><div class="help"><div><b>${L}</b>Adventurer level</div><div><b>${fmt(S.xp)}</b>Total XP</div><div><b>${S.st.right}</b>Correct answers</div><div><b>${S.st.best}</b>Best streak</div><div><b>${S.st.boss}</b>Bosses beaten</div><div><b>${S.best+1}</b>Deepest floor</div></div><p class="lede" style="font-size:12px;max-width:none">Each subject moves up a level after three first-try answers in a row, and eases down after two misses in a row. Level 2 is roughly Year 5 and level 6 roughly Year 8.</p><div class="row"><button class="btn ghost" id="resetBtn">Start a new adventure</button></div>`}
  else h+=`<div class="help"><div><b>W A S D / arrows</b>Move and turn</div><div><b>Drag</b>Look around</div><div><b>E or tap</b>Talk, open, read</div><div><b>Space</b>Jump</div><div><b>M</b>Open the map</div><div><b>1 – 4, Enter</b>Answer and continue</div></div><p class="lede" style="max-width:none">Each floor has four guardians. Pass a guardian’s trial (3 of 4 right) to win a sigil. Four sigils unseal the boss door. Beat the boss to reveal the stairs down. Along the way, crack riddle chests, read rune stones and scoop up gems. Follow the compass arrow if you get lost.</p>`;
  B.innerHTML=h;B.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>panel('codex',b.dataset.t)));const rb=$('#resetBtn');rb&&rb.addEventListener('click',()=>{if(rb.dataset.sure){const nm=S.name;S=freshSave();S.name=nm;S.started=1;enterFloor();save();closeM();toast('A new adventure begins')}else{rb.dataset.sure=1;rb.textContent='Tap again to erase all progress'}})}}

/* ---------------- input ---------------- */
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;const qo=!$('#quiz').classList.contains('hidden');
 if(qo&&Q){if(Q.done){(e.key==='Enter'||e.code==='Space')&&(e.preventDefault(),$('#qNext').click());return}const q=Q.q;if(q.type==='choice'&&/^[1-4]$/.test(e.key)){const b=$$('#qAns .opt')[+e.key-1];b&&!b.disabled&&b.click()}else if(q.type==='num'){if(/^[0-9]$/.test(e.key))padKey(e.key);else if(e.key==='Backspace')padKey('⌫');else if(e.key==='-')padKey('±');else if(e.key==='.')padKey('.');else if(e.key==='Enter')padKey('ok')}else if(q.type==='lock'){if(/^[0-9]$/.test(e.key)){Q.dial[Q.cur]=+e.key;Q.cur=(Q.cur+1)%3;showDials()}else if(e.key==='Enter')$('#qGo').click();else if(e.key==='ArrowLeft'){Q.cur=(Q.cur+2)%3;showDials()}else if(e.key==='ArrowRight'){Q.cur=(Q.cur+1)%3;showDials()}else if(e.key==='ArrowUp'||e.key==='ArrowDown'){Q.dial[Q.cur]=(Q.dial[Q.cur]+(e.key==='ArrowUp'?1:9))%10;showDials()}}
  e.key==='Escape'&&closeM();return}
 if(e.key==='Escape'&&paused&&$('#welcome').classList.contains('hidden')){closeM();return}
 if(paused)return;if(e.code==='Space'){const a=document.activeElement;a&&a.tagName==='BUTTON'&&(e.preventDefault(),a.blur())}
 e.code==='KeyE'&&interact();e.code==='KeyM'&&panel('map')});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;P.js=P.jt=0});
let drag=null,tap=null;T.addEventListener('pointerdown',e=>{drag=e.clientX;tap=[e.clientX,e.clientY,performance.now()]});addEventListener('pointermove',e=>{if(drag!==null&&!paused){P.a=(P.a+(e.clientX-drag)*.006+TAU)%TAU;drag=e.clientX}});addEventListener('pointerup',e=>{drag=null});
T.addEventListener('pointerup',e=>{if(tap&&!paused&&target&&Math.hypot(e.clientX-tap[0],e.clientY-tap[1])<10&&performance.now()-tap[2]<500)interact();tap=null});
const joy=$('#joy'),knob=$('#joyK');let joyId=null;
function joyMove(e){const rc=joy.getBoundingClientRect(),rad=rc.width/2;let dx=e.clientX-rc.left-rad,dy=e.clientY-rc.top-rad;const len=Math.hypot(dx,dy),mx=rad-14;if(len>mx){dx*=mx/len;dy*=mx/len}knob.style.transform=`translate(${dx}px,${dy}px)`;const nx=dx/mx,ny=dy/mx;P.js=Math.abs(ny)<.16?0:-ny;P.jt=Math.abs(nx)<.2?0:nx*.95}
function joyEnd(){joyId=null;knob.style.transform='';P.js=0;P.jt=0}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;try{joy.setPointerCapture(joyId)}catch(err){}joyMove(e)});joy.addEventListener('pointermove',e=>{e.pointerId===joyId&&joyMove(e)});['pointerup','pointercancel','lostpointercapture'].forEach(n=>joy.addEventListener(n,e=>{e.pointerId===joyId&&joyEnd()}));
$('#tjump').addEventListener('pointerdown',e=>{e.preventDefault();jumpReq=true});$('#tact').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
$$('[data-close]').forEach(b=>b.addEventListener('click',closeM));$('#qClose').addEventListener('click',closeM);$('#qHint').addEventListener('click',useHint);$('#qNext').addEventListener('click',advance);$('#lOk').addEventListener('click',closeM);
$$('#bar5 [data-p]').forEach(b=>b.addEventListener('click',()=>{relSel=null;panel(b.dataset.p)}));$('#helpBtn').addEventListener('click',()=>panel('codex','help'));
$('#soundBtn').addEventListener('click',()=>{S.sound=S.sound?0:1;save();hud();musicSync();S.sound&&chime([523,784])});
document.addEventListener('visibilitychange',()=>{document.hidden&&save()});
$('#beginBtn').addEventListener('click',()=>{const nm=$('#nameIn').value.replace(/[^\p{L}\p{N} '\-]/gu,'').trim().slice(0,16);nm&&(S.name=nm);const first=!S.started;S.started=1;paused0=false;$('#welcome').classList.add('hidden');paused=false;hud();musicSync();save();chime([262,330,392,523],'triangle');toast(first?`Welcome, ${S.name}!`:`Welcome back, ${S.name}!`,first?'Find a guardian. Follow the compass arrow.':`Floor ${S.depth+1}: ${FL().name}`)});
$('#nameIn').addEventListener('keydown',e=>{e.stopPropagation();e.key==='Enter'&&$('#beginBtn').click()});

/* ---------------- boot ---------------- */
S=loadSave();$('#nameIn').value=S.name==='Adventurer'?'':S.name;S.started&&($('#beginBtn').textContent='Continue the descent 🔥');enterFloor();
let lastF=performance.now();function frame(t){const dt=Math.min(.05,(t-lastF)/1e3);lastF=t;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
